<!DOCTYPE html>
<!-- Test picture for lining up the 7-inch screen: red bars 2 to 36 pixels wide at the left edge, a yellow stripe at the right -->
<html>
<body style="margin:0;width:800px;height:480px;background:#2c6f9c;color:#fff;font:20px sans-serif;overflow:hidden">
<div id="rows"></div>
<div style="position:absolute;left:200px;top:150px;width:560px;font-size:26px">
  Which is the first (top-most) row where you can see any red bar at the left edge?
</div>
<div style="position:absolute;right:0;top:0;width:6px;height:480px;background:yellow"></div>
<script>
  // One row per bar width, 2 to 36 pixels
  for (let width = 2; width <= 36; width += 2) {
    document.getElementById("rows").insertAdjacentHTML("beforeend",
      `<div style="height:26px;position:relative">` +
      `<div style="position:absolute;left:0;top:3px;width:${width}px;height:20px;background:red"></div>` +
      `<div style="position:absolute;left:60px;top:0">${width} px</div></div>`);
  }
</script>
</body>
</html>
