# Nestor settings. Copy this file to config.yaml and change what you need; config.yaml stays out of git.
# Speaker name as shown in the Google Home app (see: python -m nestor --list-speakers). Empty = the only speaker found.
speaker_name: ""
# Optional: the speaker's IP address, for when network discovery doesn't find it
speaker_host: ""
# Edge neural voice. See all voices with: .venv/Scripts/edge-tts --list-voices
voice: "en-US-EmmaMultilingualNeural"
# Speaking speed, e.g. "+10%" or "-5%"
voice_rate: "+0%"
# Voice pitch, e.g. "-4Hz" for a lower voice (John's noir delivery: en-GB-ThomasNeural, "-6%", "-4Hz")
voice_pitch: "+0Hz"
# Play a short chime before each announcement
chime: true
# Port of Nestor's web server (the speaker fetches its audio from here)
port: 8765
# Alerts (tell.py, the Claude Code hook, GitHub) that arrive in these hours are held until they end. Empty = never.
# Messages from speak.py always play straight away.
quiet_hours: "22:00-08:00"
# Announce GitHub news on your repos: CI failures and recoveries, new stars, issues and PRs from others
github_watch: true
github_poll_minutes: 5
# The Claude Code hook speaks only when a reply took at least this many minutes
claude_min_minutes: 1
# How to say folder, repo and branch names out loud, e.g. "red-piste": "Red Piste"
spoken_names: {}
# Home for the briefing's weather and sun times: "Town, ST" (e.g. "Princeton, NJ"), a ZIP code, or "lat,lon"
home_location: ""
# Where John's journeys start: your street address (kept on the board only; empty uses home_location)
home_address: ""
# "fahrenheit" or "celsius"
temperature_unit: "fahrenheit"
# Reminders are spoken this many minutes ahead, and again at their time
reminder_heads_up_minutes: 15
# Calendar events from Datebook get a heads-up this many minutes before (0 = never). Events with a leave-by from
# Datebook and all-day events are skipped, and it's only spoken while your phone is home.
event_heads_up_minutes: 10
# Hey John, the voice assistant (needs Nestor's own ANTHROPIC_API_KEY in .env)
john: true
# Your name, so John knows who he's talking to (empty = "the user")
john_owner_name: ""
# John listens for the words "Hey John" (or a request ending in ", John"), checked by this small speech-to-text model
john_wake_whisper: "tiny.en"
# Optional: a trained "Hey John" openWakeWord model in the project folder, used instead of listening for the words
john_wake_word: "hey_john.onnx"
# 0.0 to 1.0, only for a trained model: lower wakes more easily, but also by mistake more often
john_wake_threshold: 0.5
# Part of the microphone's name to use (e.g. "USB"); empty = the computer's default microphone
microphone: ""
# How sure the speech detector must be that a sound is a voice, 0.0 to 1.0 (lower hears quieter speech;
# python -m nestor --mic-test shows its scores)
john_speech_threshold: 0.4
# Speech-to-text: "whisper" on a PC, "vosk" on the Tinker Board (Whisper is too slow there), or "openai" on the board
# for much better hearing: what's said after "Hey John" goes to OpenAI (about $0.0045 a minute, needs OPENAI_API_KEY in
# .env); "Hey John" itself is still heard on the board with Vosk, which also hears everything if OpenAI can't be reached
speech_to_text: "whisper"
# OpenAI's speech-to-text model, for speech_to_text: "openai"
openai_speech_model: "gpt-transcribe"
# Whisper's model: "base.en" is faster, "small.en" is more accurate (downloaded the first time)
whisper_model: "small.en"
# Vosk's model folder in the project folder (downloaded by hand, see board/README.md)
vosk_model: "vosk-model-small-en-us-0.15"
# Claude model and effort for John's answers ("low" answers fastest)
john_model: "claude-opus-5-5"
john_effort: "low"
# How many seconds John keeps listening for a follow-up without "Hey John"
john_follow_up_seconds: 5
# Short names for your classes, said instead of Canvas's course codes. Keys are the course code without the section
# (school:subject:course), e.g. "07:211:250": "Movie VFX", or a registrar name as calendar events show it, e.g.
# "INTERMED MACRO ANALS": "Macro". Classes without one get a cleaned-up registrar name.
class_names: {}
# Your usual NJ Transit trip, as two-letter station codes (e.g. "NB" and "NY"); Datebook's saved trip wins once
# it's linked. Live trains need NJT_USERNAME and NJT_PASSWORD (your NJ Transit developer account) in .env.
train_from: ""
train_to: ""
# Govee lights on the home Wi-Fi (switch on "LAN Control" for each light in the Govee Home app)
govee: true
# Names for groups of lights, by their Govee device ids (Nestor logs them when it finds the lights), e.g.
# "wall": ["2F:3A:..."]. "Lights" alone always means all of them.
light_groups: {}
# Which group plain "lights" means ("" for all of them; "both lights" or "all" always means every light), and which
# group alert flashes and John's glow use ("" for all). Good morning and goodnight always use every light.
plain_lights: ""
signal_lights: ""
# Spotify on your phone and laptop (needs SPOTIFY_CLIENT_ID in .env; see the README)
spotify: true
# How loud Spotify goes (percent) while John listens or Nestor speaks, if it was louder
music_duck_volume: 20
# Where the Claude Code / Claude Desktop connector, the Claude Code hook and the scripts (speak.py, tell.py, ...)
# find Nestor; empty means this PC (set it when Nestor runs elsewhere, e.g. "http://192.168.1.33:8765")
nestor_url: ""
# How loud timers and alarms ring, 0.0 to 1.0
alarm_volume: 0.75
# Trial mode, for trying Nestor on a second machine while the first keeps running: no reminders, heads-ups, timers
# ringing, GitHub alerts, Spotify or Datebook link here (John and direct commands still work)
trial: false
