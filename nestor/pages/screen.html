<!DOCTYPE html>
<!-- The wall screen's placeholder until the wall display is built: a big clock, the date, and whether Nestor answers -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nestor</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #d8dce6; font-family: sans-serif; cursor: none; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #clock { font-size: 150px; font-weight: 200; letter-spacing: 2px; }
    #date { font-size: 30px; color: #8a91a3; margin-top: 4px; }
    #status { font-size: 22px; margin-top: 40px; color: #8a91a3; display: flex; align-items: center; gap: 10px; }
    #dot { width: 14px; height: 14px; border-radius: 50%; background: #3fbf6f; }
    body.down #dot { background: #e0483e; }
    body.down #status { color: #e0483e; }
  </style>
</head>
<body>
  <div id="clock"></div>
  <div id="date"></div>
  <div id="status"><span id="dot"></span><span id="status-text">Nestor is running</span></div>
  <script>
    const CHECK_SECONDS = 10;

    // Show the time and date
    function showTime() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})
        .replace(/\s?[AP]M$/i, "");
      document.getElementById("date").textContent = now.toLocaleDateString([], {weekday: "long", month: "long",
        day: "numeric"});
    }

    // Ask Nestor whether it's running, and show the answer (red when it doesn't answer)
    async function checkNestor() {
      let running = false;

      // No answer within 5 seconds counts as down
      try {
        const reply = await fetch("/health", {cache: "no-store", signal: AbortSignal.timeout(5000)});
        running = reply.ok;
      } catch (error) {
        running = false;
      }
      document.body.classList.toggle("down", !running);
      document.getElementById("status-text").textContent = running ? "Nestor is running" : "Nestor isn't answering";
    }
    showTime();
    checkNestor();
    setInterval(showTime, 1000);
    setInterval(checkNestor, CHECK_SECONDS * 1000);
  </script>
</body>
</html>
